# Settings for the editing screen at /admin
# Editors sign in with a GitHub account that has access to the repository below.

backend:
  name: github
  repo: VerdantCommerce/The-Paintress   # <-- change this to your GitHub repository
  branch: main

site_url: https://www.thepaintress.co.uk
display_url: https://www.thepaintress.co.uk
logo_url: /images/logo.png

# Not used yet (the editor only changes text), but the CMS requires these
media_folder: images/uploads
public_folder: images/uploads

collections:
  - name: pages
    label: Website copy
    editor:
      preview: false
    files:
      - name: home
        label: Home page
        file: content/home.json
        fields:
          - { name: hero_heading, label: "Top heading", widget: string }
          - { name: hero_intro, label: "Line under the top heading", widget: text }
          - { name: bio_heading, label: "About: heading", widget: string }
          - name: bio_text
            label: "About: text"
            widget: text
            hint: "Leave a blank line between paragraphs. To make a link, write [words to click](gallery.html)."
          - { name: services_heading, label: "Services: heading", widget: string }
          - { name: services_intro, label: "Services: line under the heading", widget: text }
          - name: services
            label: Services
            label_singular: service
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Description, widget: text }
          - { name: testimonials_heading, label: "Testimonials: heading", widget: string }
          - { name: testimonials_intro, label: "Testimonials: line under the heading", widget: text }
          - name: testimonials
            label: Testimonials
            label_singular: testimonial
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: quote, label: "What they said", widget: text }
              - { name: name, label: "Who said it", widget: string }
          - { name: cta_heading, label: "Bottom banner: heading", widget: string }
          - { name: cta_text, label: "Bottom banner: text", widget: text }

      - name: gallery
        label: Gallery page
        file: content/gallery.json
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: intro, label: "Line under the heading", widget: text }
          - { name: cta_heading, label: "Bottom banner: heading", widget: string }
          - { name: cta_text, label: "Bottom banner: text", widget: text }

      - name: contact
        label: Contact page
        file: content/contact.json
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: intro, label: "Line under the heading", widget: text }
          - { name: card_text, label: "Text under the WhatsApp button", widget: text }

      - name: shared
        label: Footer (every page)
        file: content/shared.json
        fields:
          - { name: footer_line, label: "Line under the footer logo", widget: string }
